<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORMATE • Access</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/dashboard.css?v=46"><style>
body{margin:0;background:#050505;color:#fff;font-family:Manrope,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.gate{width:min(92vw,470px);padding:32px}.card{background:linear-gradient(145deg,#151515,#0b0b0b);border:1px solid #292929;border-radius:24px;padding:34px;box-shadow:0 24px 80px rgba(0,0,0,.45)}.mark{width:54px;height:54px;border-radius:16px;background:#000;border:1px solid #3b3b3b;display:grid;place-items:center;color:#ff2b9b;font-size:25px;font-weight:800;margin-bottom:24px}.eyebrow{color:#ff2b9b;font-size:11px;font-weight:800;letter-spacing:.16em}.card h1{margin:8px 0 10px;font-family:'Plus Jakarta Sans';font-size:29px}.muted{color:#a7a7a7;line-height:1.55}.field{margin-top:18px}.field label{display:block;font-size:12px;color:#bdbdbd;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;background:#080808;border:1px solid #363636;border-radius:12px;color:#fff;padding:13px 14px;outline:none}.field input:focus{border-color:#ff2b9b;box-shadow:0 0 0 3px rgba(255,43,155,.12)}.btn{width:100%;margin-top:20px;border:0;border-radius:12px;padding:13px 16px;background:#ff2b9b;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;color:#ff8fc9;font-size:13px}.foot{margin-top:20px;color:#666;font-size:11px;text-align:center}
</style></head><body><main class="gate"><div class="card"><div class="mark">C</div><div class="eyebrow">CORMATE ACCESS</div><h1>Welcome to your workspace</h1><p class="muted">Enter your company email and password. Your assigned access will decide where you can go.</p><form id="loginForm"><div class="field"><label>Email ID</label><input id="email" type="email" autocomplete="username" placeholder="name@company.com" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required></div><button class="btn" id="loginBtn" type="submit">Continue →</button><div class="msg" id="msg"></div></form></div><div class="foot">CORMATE • Analytics · Automation · Insights</div></main><script>
const form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';btn.disabled=true;btn.textContent='Checking…';try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Unable to sign in');location.href=j.redirect||'/choose';}catch(err){msg.textContent=err.message;}finally{btn.disabled=false;btn.textContent='Continue →';}});
</script></body></html>
