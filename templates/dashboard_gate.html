<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORMATE • Dashboard Access</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#050505;color:#fff;font-family:Manrope,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(440px,calc(100% - 36px));background:#101010;border:1px solid #252525;border-radius:24px;padding:34px;box-shadow:0 24px 80px rgba(0,0,0,.45)}.logo{font:800 30px 'Plus Jakarta Sans';letter-spacing:4px}.logo span{color:#ff2b9a}.kicker{margin-top:28px;color:#ff2b9a;font-size:11px;font-weight:800;letter-spacing:2px}.title{font:800 32px 'Plus Jakarta Sans';margin:8px 0}.muted{color:#9ca3af;line-height:1.6}.row{display:flex;gap:10px;margin-top:24px}input{flex:1;background:#080808;border:1px solid #303030;color:#fff;border-radius:12px;padding:13px 14px;outline:none}input:focus{border-color:#ff2b9a}button{border:0;border-radius:12px;padding:13px 18px;background:#ff2b9a;color:#fff;font-weight:800;cursor:pointer}.error{margin-top:12px;color:#ff8fc8;font-size:13px}.back{display:inline-block;margin-top:22px;color:#aaa;text-decoration:none;font-size:13px}</style></head><body><main class="card"><div class="logo">CORM<span>A</span>TE</div><div class="kicker">LIMITED ACCESS</div><div class="title">Dashboard</div><p class="muted">Enter the authorized password to open the RENÉE E.K.A. analytics dashboard.</p><form id="f"><div class="row"><input id="p" type="password" placeholder="Dashboard password" autocomplete="current-password" autofocus><button>Unlock</button></div><div id="e" class="error"></div></form><a class="back" href="/entry">← Back to Field Entry</a></main><script>f.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/dashboard-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});const j=await r.json();if(r.ok&&j.ok)location.href=j.redirect;else document.getElementById('e').textContent=j.error||'Incorrect password';});</script></body></html>
