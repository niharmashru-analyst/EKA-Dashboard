<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Stock Entry • SKU 360</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/dashboard.css?v=13"></head><body class="entry-body"><div class="entry-shell"><div class="entry-card"><div class="entry-brand"><div class="brand-mark">S</div><div><div class="brand-name">SKU<span>•</span>360</div><div class="brand-sub">FIELD STOCK ENTRY</div></div></div><h1>Current Stock Submission</h1><p class="muted">Enter your company email, select your shop if required, then punch Stock and Tester.</p><div id="entryMsg"></div><div class="entry-summary"><div class="entry-stat"><span>SKU Count</span><strong id="skuCount">0</strong><small>Total SKUs currently in table</small></div><div class="entry-stat"><span>Live Entered</span><strong id="enteredCount">0</strong><small>SKUs with Stock / Tester entered</small></div><div class="entry-stat"><span>Total Qty</span><strong id="enteredQty">0</strong><small>Stock + Tester</small></div></div><div class="entry-grid"><div class="filter"><label>Email ID</label><input id="email" type="email" placeholder="name@company.com"></div><div class="filter"><label>Shop</label><select id="store" disabled><option>Enter email first</option></select></div></div><div id="skuArea" class="hidden"></div></div></div><script src="/static/entry.js?v=13"></script></body></html>
